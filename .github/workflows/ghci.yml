name: ghci

on:
  # Runs on PRs against master
  pull_request:
    branches: [ master ]
    types: [opened, synchronize, ready_for_review, reopened]

  # Manual run is used to bless
  workflow_dispatch:
    inputs:
      job_to_run:
        description: 'Job to run'
        required: true
        type: choice
        options:
          - gnu
          - cuda
          - hip
          - intel
          - all

  # Add schedule trigger for nightly runs at midnight MT (Standard Time)
  schedule:
    - cron: '0 7 * * *'  # Runs at 7 AM UTC, which is midnight MT during Standard Time

concurrency:
  # Two runs are in the same group if they are testing the same git ref
  #  - if trigger=pull_request, the ref is refs/pull/<PR_NUMBER>/merge
  #  - for other triggers, the ref is the branch tested
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --login {0}

jobs:
  tests:
    runs-on: [self-hosted, e3sm, '${{ matrix.runner }}']
    strategy:
      fail-fast: false
      matrix:
        # For manual runs, only test the requested runner (the 'matrix' context is not
        # available in the job-level 'if', so we filter the runners list here)
        runner: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.job_to_run != 'all' && format('["{0}"]', inputs.job_to_run) || '["gnu","cuda","hip","intel"]') }}
        build_type: [debug, release]
    name: ${{ matrix.runner }} / ${{ matrix.build_type }}
    steps:
      - name: Show action trigger
        uses: actions/github-script@v7
        with:
          script: |
            const eventName = context.eventName;
            const actor = context.actor || 'unknown';  // Default to 'unknown' if actor is not defined
            let eventAction = 'N/A';

            // Determine the event action based on the event type
            if (eventName === 'pull_request') {
              eventAction = context.payload.action || 'N/A';
            } else if (eventName === 'pull_request_review') {
              eventAction = context.payload.review.state || 'N/A';
            } else if (eventName === 'workflow_dispatch') {
              eventAction = 'manual trigger';
            } else if (eventName === 'schedule') {
              eventAction = 'scheduled trigger';
            }
            console.log(`The job was triggered by a ${eventName} event.`);
            console.log(`  - Event action: ${eventAction}`);
            console.log(`  - Triggered by: ${actor}`);
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          show-progress: false
          submodules: recursive
      - name: Get CUDA Arch
        if: ${{ matrix.runner == 'cuda' }}
        run: |
          # Ensure nvidia-smi is available
          if ! command -v nvidia-smi &> /dev/null; then
              echo "nvidia-smi could not be found. Please ensure you have Nvidia drivers installed."
              exit 1
          fi

          # Get the GPU model from nvidia-smi, and set env for next step
          gpu_model=$(nvidia-smi --query-gpu=name --format=csv,noheader | head -n 1)
          case "$gpu_model" in
              *"H100"*)
                  echo "ARCH=HOPPER90" >> $GITHUB_ENV
                  ;;
              *"A100"*)
                  echo "ARCH=AMPERE80" >> $GITHUB_ENV
                  ;;
              *"V100"*)
                  echo "ARCH=VOLTA70" >> $GITHUB_ENV
                  ;;
              *)
                  echo "Unsupported GPU model: $gpu_model"
                  exit 1
                  ;;
          esac
      - name: Get HIP Arch
        if: ${{ matrix.runner == 'hip' }}
        run: |
          # Ensure rocminfo is available
          if ! command -v rocminfo &> /dev/null; then
              echo "rocminfo could not be found. Please ensure you have ROCm installed."
              exit 1
          fi

          # Get the gfx target from rocminfo, and set env for next step
          gfx=$(rocminfo | grep -o -m 1 'gfx[0-9a-f]\+')
          case "$gfx" in
              gfx942)
                  echo "ARCH=AMD_GFX942" >> $GITHUB_ENV
                  ;;
              gfx90a)
                  echo "ARCH=AMD_GFX90A" >> $GITHUB_ENV
                  ;;
              gfx908)
                  echo "ARCH=AMD_GFX908" >> $GITHUB_ENV
                  ;;
              *)
                  echo "Unsupported GPU architecture: $gfx"
                  exit 1
                  ;;
          esac
      - name: Ensure CACTS is installed
        env:
          PIP_CERT: /etc/pki/tls/certs/ca-bundle.crt
        run: |
          python3 -m pip install --upgrade cacts
      - name: Run tests
        run: |
          cmd="cacts -m ghci-snl-${{ matrix.runner }} -t ${{ matrix.build_type }} -r ./"

          # Runner-specific options
          case "${{ matrix.runner }}" in
              gnu)
                  # Add the scheduler flag for nightly runs
                  if [ "${{ github.event_name }}" = "schedule" ]; then
                      cmd+=" -s"
                  fi
                  ;;
              cuda|hip)
                  # ARCH was set by the "Get CUDA/HIP Arch" step
                  cmd+=" -c Kokkos_ARCH_${{ env.ARCH }}=ON"
                  ;;
              intel)
                  cmd+=" -c CMAKE_CXX_FLAGS=-fp-model=precise"
                  ;;
          esac
          echo "CACTS call: $cmd"
          $cmd
      - name: Upload files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-files-${{ matrix.build_type }}-ghci-snl-${{ matrix.runner }}
          path: |
            ctest-build/*/Testing/Temporary/Last*.log
            ctest-build/*/ctest_resource_file.json
            ctest-build/*/ctest_script.cmake
            ctest-build/*/CMakeCache.txt
            ctest-build/**/*.xml
